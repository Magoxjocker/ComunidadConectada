buildscript {
    if (project.file('google-services.json').isFile()) {
        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath 'com.google.gms:google-services:4.6.0'
        }
    }
}

plugins {
    id 'com.android.application'
}

def localFirebase = providers.gradleProperty('communityEmulators').map { it == 'true' }.getOrElse(false)
if (localFirebase && file('google-services.json').isFile()) {
    throw new GradleException('Retira de app/google-services.json la configuración real antes de habilitar los emuladores.')
}

if (file('google-services.json').isFile()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.example.comunidadconectada'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId 'com.example.comunidadconectada'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'USE_FIREBASE_EMULATORS', 'false'
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'USE_FIREBASE_EMULATORS', localFirebase.toString()
        }
    }

    sourceSets {
        debug {
            if (localFirebase) {
                manifest.srcFile 'src/emulator/AndroidManifest.xml'
                res.srcDir 'src/emulator/res'
            }
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
